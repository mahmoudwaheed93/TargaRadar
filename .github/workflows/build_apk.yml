name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.4.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.4
          name: "AIMS-Mobile v1.1.4 (Universal Word-Merged 3-Letter Decoder + Sheet Subsequence Rescue + Letter-First UI)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.1.4
            - Universal 0ms decoder for ANY 3-letter Arabic ASR merge ("انوي" -> "ا ن ي", "راعين" -> "ا ر ع", "هاني" -> "ه ن ي", "كلام" -> "ك ل م", "سالم" -> "س ل م", "حامد" -> "ح م د", "رامي" -> "ر م ي") both live and with digits.
            - 0ms Vowel-Tolerant Sheet Rescue ("سعود 2816" -> "س ع د 2816", "احمد 2816" -> "ح م د 2816") across both Registration & Inspection modes.
            - Letter-first RTL 7-slot visualizer (`l1 l2 l3` on right, LTR `d1 d2 d3 d4` on left), LiveSpeechTicker strip removed, 6s post-speech auto-stop, and 5s far-field endpointing.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
