name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.3.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "AIMS-Mobile v1.1.3 (Letter-First Plate Slots + راعين->ا ر ع Fix + 6s Auto-Stop + Far-Field Support)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.1.3
            - Fixed 7-slot RTL display order: Letters now strictly appear first on the right (`l1 l2 l3`) followed by Digits LTR (`d1 d2 d3 d4`).
            - Removed distracting LiveSpeechTicker bar below the slots per user request.
            - Fixed `"راعين"` / `"اراعين"` / `"الراعين"` ASR merge to decode cleanly into `ا ر ع`, plus unique 3-letter permutation rescue against Excel.
            - Upgraded auto-stop to 6 seconds after speech stops (10s if idle) and widened far-field `pauseFor` to 5s.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
