name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analyzer
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.5.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.5
          name: "AIMS-Mobile v1.1.5 (Cross-Utterance Letter+Digit Linking + Filler Bridge)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.1.5
            - Added `PlateUtteranceStitcher` (5.5s rolling stitch buffer) across both Registration & Inspection modes so spoken letters & digits stay linked in live slots and commit together even across pauses or Android SpeechRecognizer restarts.
            - Added filler-word bridge (`رقم` / `نمرة` / `لوحة`) between spoken 3 letters and 3-4 digits in both orders.
            - Includes all v1.1.4 improvements: universal 3-letter word-merge decoding (`انوي`, `راعين`, etc.), vowel-tolerant sheet rescue, letter-first RTL 7-slots, 6s auto-stop, and 5s far-field endpointing.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
