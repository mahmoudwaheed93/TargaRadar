name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.0.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "AIMS-Mobile v1.0.7 (Ultra-Fast N-Best Voice Engine & Zero Dropped Letters)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.0.7
            - Ultra-fast N-Best Google STT alternate recovery for fast & noisy speech (<0.2ms on-device).
            - Zero-lag mic restart (25ms) + AudioFocus-safe match alarm so rapid dictation never stops.
            - 0ms instant commit on STT finalResult + 550ms smart debounce on digits-first speech.
            - Fixed cross-plate letter stealing on mixed-order fast consecutive plates.
            - Expanded Egyptian compound numbers ("تلات تلاف"، "متين"، "الف متين...") and strict note validation.
            - Continuous Groq LPU AI fallback on unparsed trailing speech in both Record and Inspection screens.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.0.7.apk
