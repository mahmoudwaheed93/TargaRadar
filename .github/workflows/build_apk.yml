name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.0.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "AIMS-Mobile v1.0.6 (Fix Missing Last Letter in Voice Capture)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.0.6
            - Fixed premature commit on digits-first speech so the 3rd/last letter is never cut off.
            - Fixed in-place plate upgrade when trailing letters arrive after initial capture.
            - Unified glued + single Arabic letter matching (e.g. "3253 بن ق" / "3253 ب نق").
            - Restored Location (Google Maps link) and all reference sheet columns in Inspection Excel.
            - Strict note filter & pre-configured Groq LPU AI fallback engine.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.0.6.apk
