name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.2.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "AIMS-Mobile v1.1.2 (Ultra-Fast Fused-Word Decoder + Digit-Pivot Lisp Rescue + 20-Engineer Audit)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.1.2
            - Fused Arabic letter-name decoder ("رانونيا 2816" -> "ر ن ي 2816", "سينصادعين 3253" -> "س ص ع 3253") in 0ms for ultra-fast speech.
            - Digit-Pivot Phonetic Sheet Rescue ("ذ ب ن 2816" snaps automatically to sheet "د ب ن 2816" when unique phonetic match exists).
            - Enhanced Groq AI fallback prompt for slurred/fast speech + Hugging Face runtime fallback.
            - Strict 3-letter-only rule, 3-digit zero-padding (`123` -> `1230`), 25s total-silence auto-stop, and full 20-engineer verification.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
