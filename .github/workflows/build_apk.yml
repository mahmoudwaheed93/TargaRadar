name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release > build.log 2>&1

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "AIMS-Mobile v1.0.2 (Ultra-Fast AI Voice Engine)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.0.2
            - Ultra-fast Arabic Voice Plate Extraction (0ms local normalizer).
            - Pre-configured Groq LPU AI Fallback Engine.
            - Continuous speech dictation without audio restart delays.
            - Filtered complete plates (no partial duplicates).
            - Clean UI with demo button removed.
          files: build/app/outputs/flutter-apk/app-release.apk
