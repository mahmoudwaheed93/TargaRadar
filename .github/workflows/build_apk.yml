name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analyzer
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AIMS-Mobile-v1.2.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "AIMS-Mobile v1.2.0 (Tasks A-G: Zero-Gap 0ms Restart, <8ms Incremental Engine & Multi-Dialect NLP)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚗 AIMS-Mobile / TargaRadar APK Release v1.2.0
            - Task A: Debug-only high-res JSONL telemetry logger + 60s benchmark suite.
            - Task B: Single deduplicated 0ms restart state machine, dynamic callbacks, Android recognizer beep mute (`MainActivity`), `AudioFocus.none` alarms, & `SpeechEngineType` streaming architecture.
            - Task C: On-Device fast mode default with dynamic Arabic locale resolution (`ar_EG`/`ar_SA`/`ar_AE`) & Cloud fallback + `160ms` 3-digit commit & 5s 4th-digit upgrade.
            - Task D: Precompiled static `RegExp`s, 128-entry LRU cache, incremental $O(1)$ uncommitted tail parsing (<8ms/partial), early duplicate filter & UI coalescing.
            - Task E & F: Multi-dialect letter pronunciations, glued letter+digit de-fusing, compound spoken numbers, weighted acoustic confusion matrix & 60s continuous regression suite.
            - Task G: iOS privacy keys, Web Speech API support, permanent/cloud language error termination & App Settings permission UX.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/AIMS-Mobile-v1.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: AIMS-Mobile-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
